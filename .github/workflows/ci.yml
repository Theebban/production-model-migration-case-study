name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.6 is the declared floor: the code runs through Node's type stripping, which
        # arrived in 22.6.0. Testing the floor exactly is the point of declaring one.
        node: ['22.6', '22.x', '24.x', 'current']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The demonstration is what the README tells a reader to run, so it is part of the gate.
      - run: npm run demo

  # The documentation must describe this repository: every `npm run` script it names exists,
  # every relative link resolves, no clone command is a placeholder. Checked by asinstalled,
  # installed from npm, pinned to an exact version. (asinstalled's `check` does not apply: this repository is a
  # case study, not a package with entry points to install.)
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npx --yes asinstalled@0.1.0 docs --dir .
