name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.6 is the declared floor: the code runs through Node's type stripping, which
        # arrived in 22.6.0. Testing the floor exactly is the point of declaring one.
        node: ['22.6', '22.x', '24.x', 'current']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The demonstration is what the README tells a reader to run, so it is part of the gate.
      - run: npm run demo
